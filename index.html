<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Access Denied</title>
<meta name="theme-color" content="#f4f1ec" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#f4f1ec;color:#23211e;
       font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
  main{text-align:center;max-width:32rem}
  h1{font-size:2rem;margin:0;font-weight:700}
  @media (prefers-color-scheme: dark){ body{background:#1b1a18;color:#f4f1ec} }
</style>
</head>
<body>
<main>
  <h1>Access Denied</h1>
</main>
<script>
// Every function of this app has been withdrawn (v3.0.0). The service worker is still registered
// so installed copies pick up this page, serve it offline, and refuse every other file.
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  let firstControllerSeen = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!firstControllerSeen) { firstControllerSeen = true; return; }
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js", { updateViaCache: "none" })
      .then((reg) => { reg.update().catch(() => {}); })
      .catch(() => {});
  });
}
</script>
</body>
</html>
