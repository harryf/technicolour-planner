name: Deploy to GitHub Pages

# Deploys the static site to GitHub Pages.
# Triggers: every push to main (continuous), every v* tag (tagged release), and manual run.
# No build step — the app is a single static file; the workflow just publishes the repo.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# Permissions the Pages deploy needs
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root (single-file app + assets). Markdown docs ride along harmlessly.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
