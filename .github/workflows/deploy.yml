name: Deploy to GitHub Pages

# Deploys the static site to GitHub Pages.
# Triggers: every push to main (continuous) and manual run.
# NOT on v* tags: the github-pages environment protection rule only allows the main branch to deploy,
# so a tag-triggered run is rejected ("Tag vX is not allowed to deploy to github-pages"). The push to
# main already publishes the same commit, and v* tags are handled by release.yml (the GitHub Release).
# No build step, the app is a single static file; the workflow just publishes the repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions the Pages deploy needs
permissions:
  contents: read
  pages: write
  id-token: write

# Run JS actions on Node 24 now (GitHub forces this on 2026-06-16); proves compatibility early.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Allow one concurrent deployment; don't cancel an in-progress one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Publish the repo root (single-file app + assets). Markdown docs ride along harmlessly.
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
